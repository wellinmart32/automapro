<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

          <!-- Logo -->
          <div class="text-center mb-4">
            <i class="bi bi-box text-primary" style="font-size: 3rem;"></i>
            <h4 class="mt-2 mb-0">AutomaPro</h4>
            <p class="text-muted small">Nueva Contraseña</p>
          </div>

          <!-- Token inválido -->
          <div *ngIf="tokenInvalido" class="text-center">
            <div class="alert alert-danger">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ mensajeError }}
            </div>
            <a routerLink="/recuperar-password" class="btn btn-primary">
              Solicitar nuevo enlace
            </a>
          </div>

          <!-- Éxito -->
          <div *ngIf="mensajeExito" class="text-center">
            <div class="alert alert-success">
              <i class="bi bi-check-circle me-2"></i>
              {{ mensajeExito }}
            </div>
          </div>

          <!-- Formulario -->
          <div *ngIf="!tokenInvalido && !mensajeExito">

            <div class="alert alert-danger" *ngIf="mensajeError">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ mensajeError }}
            </div>

            <div class="mb-3">
              <label class="form-label">Nueva contraseña</label>
              <div class="input-group">
                <input
                  [type]="verPassword ? 'text' : 'password'"
                  class="form-control"
                  [(ngModel)]="password"
                  placeholder="••••••••"
                  [disabled]="cargando">
                <button class="btn btn-outline-secondary" type="button" (click)="verPassword = !verPassword">
                  <i class="bi" [ngClass]="verPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
              </div>
              <small class="text-muted">Mínimo 6 caracteres</small>
            </div>

            <div class="mb-4">
              <label class="form-label">Confirmar contraseña</label>
              <div class="input-group">
                <input
                  [type]="verConfirmar ? 'text' : 'password'"
                  class="form-control"
                  [(ngModel)]="confirmarPassword"
                  placeholder="••••••••"
                  [disabled]="cargando">
                <button class="btn btn-outline-secondary" type="button" (click)="verConfirmar = !verConfirmar">
                  <i class="bi" [ngClass]="verConfirmar ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
              </div>
            </div>

            <button
              class="btn btn-primary w-100 mb-3"
              (click)="restablecerPassword()"
              [disabled]="cargando">
              <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
              <i class="bi bi-lock me-2" *ngIf="!cargando"></i>
              Guardar Nueva Contraseña
            </button>

            <div class="text-center">
              <a routerLink="/login" class="text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i>
                Volver al inicio de sesión
              </a>
            </div>

          </div>

        </div>
      </div>

    </div>
  </div>
</div>
