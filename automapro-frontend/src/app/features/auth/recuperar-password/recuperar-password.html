<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

          <!-- Logo -->
          <div class="text-center mb-4">
            <i class="bi bi-box text-primary" style="font-size: 3rem;"></i>
            <h4 class="mt-2 mb-0">AutomaPro</h4>
            <p class="text-muted small">Recuperar Contraseña</p>
          </div>

          <!-- Mensaje éxito -->
          <div class="alert alert-success" *ngIf="mensajeExito">
            <i class="bi bi-check-circle me-2"></i>
            {{ mensajeExito }}
          </div>

          <!-- Formulario -->
          <div *ngIf="!mensajeExito">
            <p class="text-muted small mb-4">
              Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <!-- Error -->
            <div class="alert alert-danger" *ngIf="mensajeError">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ mensajeError }}
            </div>

            <div class="mb-3">
              <label class="form-label">Correo Electrónico</label>
              <input
                type="email"
                class="form-control"
                [(ngModel)]="email"
                placeholder="tu@email.com"
                [disabled]="cargando">
            </div>

            <button
              class="btn btn-primary w-100 mb-3"
              (click)="enviarSolicitud()"
              [disabled]="cargando">
              <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
              <i class="bi bi-envelope me-2" *ngIf="!cargando"></i>
              Enviar Enlace
            </button>
          </div>

          <div class="text-center">
            <a routerLink="/login" class="text-decoration-none small">
              <i class="bi bi-arrow-left me-1"></i>
              Volver al inicio de sesión
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
