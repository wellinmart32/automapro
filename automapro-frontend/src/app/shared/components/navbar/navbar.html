<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">

    <!-- Logo/Marca -->
    <a class="navbar-brand fw-bold text-white" routerLink="/catalogo">
      <i class="bi bi-robot me-2"></i>
      AutomaPro
    </a>

    <!-- Botón toggle para móvil -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menú de navegación -->
    <div class="collapse navbar-collapse" id="navbarNav">

      <!-- Menú para usuarios NO autenticados -->
      <ul class="navbar-nav me-auto" *ngIf="!estaAutenticado()">
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/catalogo"
             routerLinkActive="active-nav"
             [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-grid-3x3-gap me-1"></i>
            Catálogo
          </a>
        </li>
      </ul>

      <!-- Menú Admin (autenticado como ADMIN) -->
      <ul class="navbar-nav me-auto" *ngIf="estaAutenticado() && esAdmin">
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/admin/tablero"
             routerLinkActive="active-nav">
            <i class="bi bi-speedometer2 me-1"></i>
            Tablero
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/admin/usuarios"
             routerLinkActive="active-nav">
            <i class="bi bi-people me-1"></i>
            Usuarios
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/admin/aplicaciones"
             routerLinkActive="active-nav">
            <i class="bi bi-app me-1"></i>
            Aplicaciones
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/admin/licencias"
             routerLinkActive="active-nav">
            <i class="bi bi-key me-1"></i>
            Licencias
          </a>
        </li>
      </ul>

      <!-- Menú Cliente (autenticado como CLIENTE) -->
      <ul class="navbar-nav me-auto" *ngIf="estaAutenticado() && !esAdmin">
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/catalogo"
             routerLinkActive="active-nav"
             [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-grid-3x3-gap me-1"></i>
            Catálogo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/cliente/tablero"
             routerLinkActive="active-nav">
            <i class="bi bi-speedometer2 me-1"></i>
            Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/cliente/mis-apps"
             routerLinkActive="active-nav">
            <i class="bi bi-box-seam me-1"></i>
            Mis Aplicaciones
          </a>
        </li>
      </ul>

      <!-- Botones de Login/Registro (NO autenticado) -->
      <ul class="navbar-nav" *ngIf="!estaAutenticado()">
        <li class="nav-item">
          <a class="nav-link fw-semibold px-3 py-2 rounded text-white"
             routerLink="/login"
             routerLinkActive="active-nav">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Iniciar Sesión
          </a>
        </li>
        <li class="nav-item ms-1">
          <a class="btn btn-outline-light fw-semibold btn-sm px-3 py-2"
             routerLink="/registro">
            <i class="bi bi-person-plus me-1"></i>
            Registrarse
          </a>
        </li>
      </ul>

      <!-- Usuario y cerrar sesión (autenticado) -->
      <ul class="navbar-nav" *ngIf="estaAutenticado()">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle fw-semibold text-white"
             href="#"
             id="navbarDropdown"
             role="button"
             data-bs-toggle="dropdown"
             aria-expanded="false">
            <i class="bi bi-person-circle me-1"></i>
            {{ usuarioActual?.nombre }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
            <li>
              <span class="dropdown-item-text text-muted small">
                {{ usuarioActual?.email }}
              </span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li *ngIf="!esAdmin">
              <a class="dropdown-item" routerLink="/cliente/perfil">
                <i class="bi bi-person me-2"></i>
                Mi Perfil
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item" href="#" (click)="cerrarSesion(); $event.preventDefault()">
                <i class="bi bi-box-arrow-right me-2"></i>
                Cerrar Sesión
              </a>
            </li>
          </ul>
        </li>
      </ul>

    </div>
  </div>
</nav>

<style>
  .active-nav {
    background-color: white !important;
    color: #0d6efd !important;
  }
  .active-nav i {
    color: #0d6efd !important;
  }
</style>
